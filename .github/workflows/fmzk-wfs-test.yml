name: FMZK-WFS-Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_fmzk.py"
      - "tests/test_fetch_fmzk.py"
      - ".github/workflows/fmzk-wfs-test.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lokale Tests
        run: python -m unittest discover -s tests -v
      - name: Kleine FMZK-WFS-Testdaten abrufen
        run: python scripts/fetch_fmzk.py
      - name: Testdaten als Artifact bereitstellen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fmzk-wfs-test
          path: data/raw/
          retention-days: 7
