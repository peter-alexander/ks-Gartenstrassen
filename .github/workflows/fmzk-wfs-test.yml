name: FMZK-WFS-Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_fmzk.py"
      - "scripts/analyze_fmzk.py"
      - "tests/**"
      - "requirements-analysis.txt"
      - ".github/workflows/fmzk-wfs-test.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: GIS-Abhängigkeiten installieren
        run: python -m pip install -r requirements-analysis.txt
      - name: Lokale Tests
        run: python -m unittest discover -s tests -v
      - name: Kleine FMZK-WFS-Testdaten abrufen
        run: python scripts/fetch_fmzk.py
      - name: Flächenstatistik aus lokalem GeoJSON
        run: python -m scripts.analyze_fmzk
      - name: Testdaten und Berichte als Artifact bereitstellen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fmzk-wfs-test
          path: |
            data/raw/
            data/processed/
          retention-days: 7
