name: GeoPackage-Code-Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements-analysis.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements-analysis.txt"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python GIS-Pakete installieren
        run: python -m pip install -r requirements-analysis.txt
      - name: Wiener Shell-Einstiegspunkte syntaktisch prüfen
        run: bash -n scripts/run-gip-parallel-wien.sh scripts/run-sis-v2-wien.sh scripts/run-sis-v2-pilot.sh scripts/run-wien-gartenstrassen.sh
      - name: Tests ohne Geodaten und ohne Netzabfragen ausführen
        run: python -m unittest discover -s tests -v
