name: CGAL Voronoi Build Check

on:
  push:
    paths:
      - "code/cgal/**"
      - "code/scripts/test_cgal_native_end_to_end.py"
      - "code/scripts/cgal_coincident_endpoint_group.py"
      - "code/scripts/cgal_group_topology_consistency.py"
      - "code/scripts/cgal_group_primal_indices.py"
      - "code/scripts/cgal_primal_index_calibration.py"
      - "code/scripts/cgal_signature_coverage.py"
      - "code/scripts/cgal_targeted_signature_probes.py"
      - "code/tests/test_cgal_targeted_signature_probes.py"
      - "code/tests/test_cgal_signature_coverage.py"
      - "code/tests/test_cgal_primal_index_calibration.py"
      - "code/tests/test_cgal_group_primal_indices.py"
      - "code/tests/test_cgal_coincident_endpoint_group.py"
      - "code/tests/test_cgal_group_topology_consistency.py"
      - ".github/workflows/cgal-voronoi.yml"
  pull_request:
    paths:
      - "code/cgal/**"
      - "code/scripts/test_cgal_native_end_to_end.py"
      - "code/scripts/cgal_native_adapter.py"
      - "code/scripts/cgal_topology_proof.py"
      - "code/scripts/cgal_subface_validation.py"
      - "code/scripts/cgal_repair_test_cells.py"
      - "code/scripts/cgal_generator_mismatch_audit.py"
      - "code/scripts/cgal_grid_conflict_audit.py"
      - "code/scripts/cgal_directed_boundary_audit.py"
      - "code/scripts/cgal_pair_constraints.py"
      - "code/scripts/cgal_shared_boundary_audit.py"
      - "code/scripts/cgal_native_source_audit.py"
      - "code/scripts/cgal_degenerate_ray_sides.py"
      - "code/scripts/cgal_endpoint_dual_candidates.py"
      - "code/scripts/cgal_endpoint_neighbor_audit.py"
      - "code/scripts/cgal_directed_side_calibration.py"
      - "code/scripts/cgal_actual_shared_ray_sides.py"
      - "code/scripts/cgal_primal_side_hypothesis.py"
      - "code/scripts/cgal_endpoint_ray_local_sides.py"
      - "code/scripts/cgal_coincident_endpoint_group.py"
      - "code/scripts/cgal_group_topology_consistency.py"
      - "code/scripts/cgal_group_primal_indices.py"
      - "code/scripts/cgal_primal_index_calibration.py"
      - "code/scripts/cgal_signature_coverage.py"
      - "code/scripts/cgal_targeted_signature_probes.py"
      - "code/tests/test_cgal_targeted_signature_probes.py"
      - "code/tests/test_cgal_signature_coverage.py"
      - "code/tests/test_cgal_primal_index_calibration.py"
      - "code/tests/test_cgal_group_primal_indices.py"
      - "code/tests/test_cgal_coincident_endpoint_group.py"
      - "code/tests/test_cgal_group_topology_consistency.py"
      - ".github/workflows/cgal-voronoi.yml"
  workflow_dispatch:

jobs:
  build-cgal-voronoi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install CGAL
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcgal-dev libgmp-dev libmpfr-dev
      - name: Syntax-check CGAL Python pipeline
        run: |
          python3 -m py_compile code/scripts/build_cgal_voronoi_geojson.py code/scripts/cgal_segment_input.py
          bash -n code/scripts/run-cgal-voronoi-debug-wien.sh
      - name: Build CGAL dual exporter
        run: |
          cmake -S code/cgal -B build/cgal -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cgal --parallel 2
      - name: Prepare Python GIS test environment
        run: |
          python3 -m venv /tmp/ks-cgal-test-env
          /tmp/ks-cgal-test-env/bin/python -m pip install -r code/requirements-analysis.txt
      - name: Validate small native dual output
        run: |
          printf '0 0 10000 0\n0 10000 10000 10000\n20000 0 30000 0\n' |
            build/cgal/cgal_voronoi_edges --edges /tmp/cgal-dual.txt --sites /tmp/cgal-sites.txt --labelled-edges /tmp/cgal-labelled.txt --bounds -5000 -5000 35000 20000
          test -s /tmp/cgal-dual.txt
          test -s /tmp/cgal-sites.txt
          test -s /tmp/cgal-labelled.txt
          grep -q "^E [0-9]" /tmp/cgal-labelled.txt
          grep -Eq "^E [0-9]+ [PS] .* \\| [PS] " /tmp/cgal-labelled.txt
          grep -q "^S " /tmp/cgal-sites.txt
          grep -q "^P " /tmp/cgal-sites.txt
          PYTHONPATH=code python3 - <<'PY'
          from collections import Counter
          from scripts.cgal_labelled_edges import labelled_edges_file
          with open("/tmp/cgal-dual.txt",encoding="utf-8") as stream:
              plain=Counter(line.strip() for line in stream)
          labelled=Counter()
          edges=0
          for idx,sites,fragments in labelled_edges_file("/tmp/cgal-labelled.txt"):
              edges+=1
              for kind,coords in fragments:
                  labelled[f"{kind} "+ " ".join(format(x,".17g") for x in coords)]+=1
          assert edges>0
          assert plain==labelled,(plain-labelled,labelled-plain)
          PY
          head -n 5 /tmp/cgal-dual.txt
      - name: Validate coincident endpoint counterexamples
        run: |
          PYTHONPATH=code /tmp/ks-cgal-test-env/bin/python -m unittest discover -s code/tests -p 'test_cgal_coincident_endpoint_group.py' -v
          PYTHONPATH=code /tmp/ks-cgal-test-env/bin/python -m unittest discover -s code/tests -p 'test_cgal_group_topology_consistency.py' -v
          PYTHONPATH=code /tmp/ks-cgal-test-env/bin/python -m unittest discover -s code/tests -p 'test_cgal_group_primal_indices.py' -v
          PYTHONPATH=code /tmp/ks-cgal-test-env/bin/python -m unittest discover -s code/tests -p 'test_cgal_primal_index_calibration.py' -v
          PYTHONPATH=code /tmp/ks-cgal-test-env/bin/python -m unittest discover -s code/tests -p 'test_cgal_signature_coverage.py' -v
          PYTHONPATH=code /tmp/ks-cgal-test-env/bin/python -m unittest discover -s code/tests -p 'test_cgal_targeted_signature_probes.py' -v
      - name: Validate labelled CGAL cells
        run: |
          PYTHONPATH=code /tmp/ks-cgal-test-env/bin/python -m scripts.test_cgal_native_end_to_end --binary build/cgal/cgal_voronoi_edges --diagnose

      - name: Probe synthetic native target signatures (diagnostic only)
        run: |
          PYTHONPATH=code /tmp/ks-cgal-test-env/bin/python -m scripts.cgal_targeted_signature_probes --binary build/cgal/cgal_voronoi_edges
