name: CGAL Voronoi Build Check

on:
  workflow_dispatch:
  push:
    paths:
      - "code/cgal/**"
      - "code/scripts/build_cgal_voronoi_geojson.py"
      - "code/scripts/build_cgal_pre_sis.py"
      - "code/scripts/cgal_site_ownership.py"
      - "code/scripts/cgal_segment_input.py"
      - "code/scripts/cgal_original_vertices.py"
      - "code/scripts/cgal_native_faces.py"
      - "code/scripts/cgal_native_face_preview.py"
      - "code/scripts/build_cgal_native_faces_pre_sis.py"
      - ".github/workflows/cgal-voronoi.yml"
  pull_request:
    paths:
      - "code/cgal/**"
      - "code/scripts/build_cgal_voronoi_geojson.py"
      - "code/scripts/cgal_segment_input.py"
      - ".github/workflows/cgal-voronoi.yml"

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install CGAL
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libcgal-dev libgmp-dev libmpfr-dev
      - name: Build CGAL Voronoi exporter
        run: |
          cmake -S code/cgal -B build/cgal -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cgal --parallel 2
      - name: Segment Voronoi smoke test
        run: |
          printf '0 0 20000 0\n0 10000 20000 10000\n0 20000 20000 20000\n' | \
            build/cgal/cgal_voronoi_edges --edges /tmp/cgal-dual.txt --sites /tmp/cgal-sites.txt --bounds -5000 -5000 25000 25000
          test -s /tmp/cgal-dual.txt
          test -s /tmp/cgal-sites.txt
          grep -q "^S " /tmp/cgal-sites.txt
          grep -q "^P " /tmp/cgal-sites.txt
      - name: Native sites to Voronoi cells to edge_id
        run: |
          python -m pip install -q -r code/requirements-analysis.txt numpy
          PYTHONPATH=code python code/tests/cgal_native_pre_sis_smoke.py /tmp/cgal-dual.txt /tmp/cgal-sites.txt

      - name: Native CGAL Voronoi face export
        run: |
          printf '0 0 20000 0\n0 10000 20000 10000\n0 20000 20000 20000\n-40000 -40000 60000 -40000\n60000 -40000 60000 60000\n60000 60000 -40000 60000\n-40000 60000 -40000 -40000\n' | \
            build/cgal/cgal_voronoi_faces --faces /tmp/cgal-native-faces.txt
          test -s /tmp/cgal-native-faces.txt
          grep -q '^F ' /tmp/cgal-native-faces.txt
          grep -q '^H ' /tmp/cgal-native-faces.txt
          grep -q '^Z' /tmp/cgal-native-faces.txt
          PYTHONPATH=code python code/tests/cgal_native_face_smoke.py /tmp/cgal-native-faces.txt
      - name: Originaler innerer Stützpunkt als native CGAL-Punkt-Face
        run: |
          printf '0 0 10000 0\n10000 0 15000 12000\n-40000 -40000 60000 -40000\n60000 -40000 60000 60000\n60000 60000 -40000 60000\n-40000 60000 -40000 -40000\n' | \
            build/cgal/cgal_voronoi_faces --faces /tmp/cgal-native-inner-points.txt
          grep -q '^P 10000 0
 /tmp/cgal-native-inner-points.txt
          PYTHONPATH=code python code/tests/cgal_original_inner_point_face_smoke.py /tmp/cgal-native-inner-points.txt
