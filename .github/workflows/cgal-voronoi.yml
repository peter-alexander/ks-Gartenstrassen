name: CGAL Voronoi Build Check

on:
  workflow_dispatch:
  push:
    paths:
      - "code/cgal/**"
      - "code/scripts/build_cgal_voronoi_geojson.py"
      - "code/scripts/cgal_segment_input.py"
      - ".github/workflows/cgal-voronoi.yml"
  pull_request:
    paths:
      - "code/cgal/**"
      - "code/scripts/build_cgal_voronoi_geojson.py"
      - "code/scripts/cgal_segment_input.py"
      - ".github/workflows/cgal-voronoi.yml"

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install CGAL
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libcgal-dev libgmp-dev libmpfr-dev
      - name: Build CGAL Voronoi exporter
        run: |
          cmake -S code/cgal -B build/cgal -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cgal --parallel 2
      - name: Segment Voronoi smoke test
        run: |
          printf '0 0 20000 0\n0 10000 20000 10000\n0 20000 20000 20000\n' | \
            build/cgal/cgal_voronoi_edges --edges /tmp/cgal-dual.txt --bounds -5000 -5000 25000 25000
          test -s /tmp/cgal-dual.txt
